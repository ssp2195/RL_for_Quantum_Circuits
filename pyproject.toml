[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-for-quantum-circuits"
version = "0.1.0"
description = "RL-guided frontier search for small Clifford+T quantum circuits"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "gymnasium>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.setuptools]
py-modules = ["ckt_types", "config", "enums", "evaluate", "train"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "algebra*",
    "canonical*",
    "certification*",
    "circuit*",
    "env*",
    "rl*",
    "search*",
]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
