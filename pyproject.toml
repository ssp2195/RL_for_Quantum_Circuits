[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-qcs"
version = "0.8.0"
description = "Hierarchical exact Clifford+T synthesis with ancilla contracts and guided QFT generation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "matplotlib>=3.7"]

[project.scripts]
hybrid-qcs = "hybrid_qcs.runner:main"
hybrid-qcs-crossover = "hybrid_qcs.crossover_runner:main"
hybrid-qcs-mixed-crossover = "hybrid_qcs.mixed_crossover_runner:main"
hybrid-qcs-canonicalization-audit = "hybrid_qcs.canonicalization_audit:main"
hybrid-qcs-ancilla = "hybrid_qcs.ancilla_runner:main"
hybrid-qcs-qft3 = "hybrid_qcs.qft_guided:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hybrid_qcs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
