[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-qcs"
version = "0.3.0"
description = "Online-RL frontier ranking for exact small Clifford+T synthesis"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
hybrid-qcs = "hybrid_qcs.runner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hybrid_qcs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
