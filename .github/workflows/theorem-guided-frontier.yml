name: Exact theorem-guided causal frontier
on:
  push:
    branches: [theorem-guided-causal-frontier-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-exact-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r publication_native/requirements-reproduction.txt && python -m pip install -e '.[dev]'
      - name: M1 construction and M2 frontier tests
        run: python -m pytest -q tests/test_theorem_guided_frontier.py
      - name: All repository regressions
        run: python -m pytest -q
      - name: BNN and staged-correction experiments
        run: python -m hybrid_qcs.cleanup.theorem_guided_runner --output /tmp/theorem_guided_results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theorem-guided-causal-results
          path: /tmp/theorem_guided_results.json
          retention-days: 30
