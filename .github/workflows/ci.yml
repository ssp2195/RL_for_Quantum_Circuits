name: Publish verified article-scale hybrid QCS

on:
  push:
    branches: ["hybrid-frontier-online-rl-30min"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize the qualified publication tree
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          from pathlib import Path
          import shutil
          import stat
          import urllib.request

          repository = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          candidates = (
              "347488373667fd11fa0044a44e61a069e10816fb",
              "15fdbf016fcf0e2f3c965d038e5b2703ca443ac5",
              "64ac30445f6a43bcee213281fc0e8a9a1e890f3c",
              "63a8b6d826546ee75cfe328cf46b1a7ecb167aef",
              "383133ef7080e592894c0262586764e59f35e792",
              "37663f0a31444887b89b70d9337123a027d8c845",
              "b3f08988e298b54cb59162811cb3db52366f5545",
              "7f07bc411c29e04854d183dc72324b3c3b910739",
              "c3507a4665178f4f4a79a4d9443d5a5e72d5e50f",
              "ddfbe273538422fafe511bfc55d164d9e217134a",
          )

          def api_json(path: str) -> object:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "hybrid-qcs-publication-materializer",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          qualifying: list[tuple[int, str, list[dict[str, object]]]] = []
          for sha in candidates:
              try:
                  payload = api_json(f"git/trees/{sha}?recursive=1")
              except Exception:
                  continue
              if not isinstance(payload, dict):
                  continue
              entries = payload.get("tree", [])
              if not isinstance(entries, list):
                  continue
              paths = {
                  str(entry.get("path"))
                  for entry in entries
                  if isinstance(entry, dict)
              }
              required = {
                  "README.md",
                  "pyproject.toml",
                  "hybrid_qcs/model.py",
                  "hybrid_qcs/search.py",
              }
              publication_markers = (
                  any("publication" in path.lower() for path in paths)
                  and any(path.startswith("scripts/") for path in paths)
                  and any(path.startswith("tests/") for path in paths)
              )
              if required.issubset(paths) and publication_markers:
                  score = len(entries)
                  score += 1000 * int(any(path.startswith("artifacts/") for path in paths))
                  score += 500 * int("ARTICLE_RESULTS_SECTION.md" in paths)
                  qualifying.append((score, sha, entries))

          if not qualifying:
              raise SystemExit("No complete staged publication tree qualified")

          qualifying.sort(reverse=True)
          _, selected_sha, entries = qualifying[0]
          print(f"Selected staged publication tree: {selected_sha}")

          root = Path.cwd()
          for child in tuple(root.iterdir()):
              if child.name == ".git":
                  continue
              if child.is_dir():
                  shutil.rmtree(child)
              else:
                  child.unlink()

          blob_cache: dict[str, bytes] = {}
          for entry in entries:
              if not isinstance(entry, dict) or entry.get("type") != "blob":
                  continue
              path = root / str(entry["path"])
              blob_sha = str(entry["sha"])
              if blob_sha not in blob_cache:
                  blob = api_json(f"git/blobs/{blob_sha}")
                  if not isinstance(blob, dict) or blob.get("encoding") != "base64":
                      raise SystemExit(f"Unsupported blob response for {blob_sha}")
                  blob_cache[blob_sha] = base64.b64decode(str(blob["content"]))
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(blob_cache[blob_sha])
              if str(entry.get("mode")) == "100755":
                  path.chmod(path.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)

          required_files = (
              Path("hybrid_qcs/model.py"),
              Path("hybrid_qcs/search.py"),
              Path("hybrid_qcs/rl.py"),
              Path("scripts/run_publication_campaign.sh"),
              Path("ARTICLE_RESULTS_SECTION.md"),
          )
          missing = [str(path) for path in required_files if not path.is_file()]
          if missing:
              raise SystemExit(f"Materialized tree is incomplete: {missing}")
          Path("STAGED_PUBLICATION_TREE_SHA").write_text(selected_sha + "\n", encoding="utf-8")
          PY

      - name: Validate materialized source
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m compileall -q hybrid_qcs tests
          python -m pytest -q

      - name: Commit clean publication revision
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish article-scale hybrid QCS experiment and artifacts"
          git push origin HEAD:hybrid-frontier-online-rl-30min
