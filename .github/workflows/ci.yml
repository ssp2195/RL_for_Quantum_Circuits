name: Validate ancilla-isometry hierarchical QCS

on:
  push:
    branches: ["ancilla-isometry-hierarchical-v1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Regression and ancilla tests
        run: |
          python -m compileall -q hybrid_qcs tests
          python -m pytest -q
          git diff --check
      - name: Verify article package integrity
        working-directory: Ancilla research article latex
        run: sha256sum -c CHECKSUMS.sha256
      - name: Bounded ancilla qualification
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python -m hybrid_qcs.ancilla_runner \
            --output-dir outputs/ancilla-ci-qualification \
            --qft-allocations 64 \
            --qft-wall-limit 0.5
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("outputs/ancilla-ci-qualification/ancilla_summary.json").read_text()
          )
          assert all(row["success"] for row in result["evaluations"]), result["evaluations"]
          assert result["qft3"]["witness_certified"] is True, result["qft3"]
          PY
