name: Reconstruct and publish the final QCS study

on:
  push:
    branches: ["publication-transfer-20260909"]
    paths: [".github/workflows/import-publication-bundle.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-qcs-publication-transfer
  cancel-in-progress: false

jobs:
  reconstruct-test-publish:
    if: github.repository == 'ssp2195/RL_for_Quantum_Circuits'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MPLBACKEND: Agg
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Reconstruct and verify the locally validated publication source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/qcs-transfer /tmp/qcs-publication
          mkdir -p /tmp/qcs-transfer
          for sha in \
            10d775e5ccb3eec22aae0af7185290d6633c7008 \
            3c3f447a145a813b4d238e94739754b2b608d10f \
            fa1b9b171b425e62c8f50c03afd50b341e95c1cb \
            94314d383ba9a0ddd4de6ffe3ca25914573ecf5f \
            1e8e495d7865a1e84e32e0707bf2448829e4ec11 \
            a7fb7a3a1530c6e894b3d1b9fd6040fa05e8f427 \
            b48232724dfd6344592087a13cc8603eda68917f \
            daca81940b8769dd4b7e07fe80070acddcb76152 \
            bead2ff6ed482b719ff71d08eac44cbd0a5770bf \
            ba1253401447151bfa4b0f013dfed2fe431c573c \
            7278a276b6b3c6e3fef8b490a11d9efcbc43f709 \
            a088d3ca64edac5ea6af7129e9c37eafcbe450b1 \
            a1c005af208de5d80ed14af59dea1e58fcc30563 \
            1fe15303b5c8cb5deb384d2baf3a0fc9cb79e669 \
            7aa0f4babdc3c819c562c3d57f485a3c5e4a7df8 \
            064cdedfb5bdf255387e5c4e310f391e54ecb1c9 \
            f1dc40231d55fd670999db33bfe65f23e52557de \
            e82b87a6c53b8da6e9c94a68953aa91bbdfa460b \
            c1744122b3949cf5148b85ded3bb346042d24f64 \
            d0ec9b7b84a5a52aca84b5b1c6cec9beb8d4cf9c \
            0810b38db26a707c77a143df9893c11ba45550d1 \
            62308bf7bbec8766ef674e0eb7769e0f0ad89310 \
            3e2a19f42126eb293d6af5a185654fa78c54610d \
            63a8705281d38a64119a6b6962ce59ebf5cd43fa \
            3ba4214e119f98adaef5e963b96e27f8585ed102 \
            5abba349664059344813454cb2f8dbbbead2b629; do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" --jq .content | base64 --decode >> /tmp/qcs-transfer/source.patch.zst
          done
          echo 'e26d0edba5ca88c812306575f30f0487fe10eff2cf16ba10a7338004f8830090  /tmp/qcs-transfer/source.patch.zst' | sha256sum -c -
          zstd -q -d /tmp/qcs-transfer/source.patch.zst -o /tmp/qcs-transfer/source.patch
          echo '8f743fdd5a688bf24ae50e02d04ba616a64bac32e7af4a7a761268164c354606  /tmp/qcs-transfer/source.patch' | sha256sum -c -
          git worktree add --detach /tmp/qcs-publication dfa7f9081a289a0b645eea70d8192c89cc17c1eb
          cd /tmp/qcs-publication
          git apply --check /tmp/qcs-transfer/source.patch
          git apply /tmp/qcs-transfer/source.patch
          git add -A
          test "$(git write-tree)" = 'eba5f4740b34109577bd98e377f6c8ea02678bcd'
          git diff --cached --check
          test "$(git hash-object .github/workflows/publication-ci.yml)" = '2048b318a5f90752fbca9747ba0a7b78fae136e2'
          echo 'Source payload, patch and exact source tree verified.' >> "$GITHUB_STEP_SUMMARY"

      - name: Install publication dependencies
        working-directory: /tmp/qcs-publication
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r publication/requirements-reproduction.txt
          python -m pip install -e '.[dev]'

      - name: Re-run the complete locked study on GitHub
        working-directory: /tmp/qcs-publication
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/reproduce_publication.sh --output-dir experiments/publication_v1 --publication-dir publication
          test -f experiments/publication_v1/ALL_CAMPAIGNS_COMPLETE
          test -f experiments/publication_v1/PRIMARY_COMPLETE

      - name: Run the complete post-training circuit-generation suite
        working-directory: /tmp/qcs-publication
        shell: bash
        env:
          QCS_PUBLICATION_MODELS: experiments/publication_v1/checkpoints
        run: |
          set -euo pipefail
          python -m compileall -q hybrid_qcs tests
          python -m pytest -q | tee /tmp/qcs-transfer/pytest.log
          grep -Eq '481 passed' /tmp/qcs-transfer/pytest.log
          python -m hybrid_qcs.publication_evidence --capsule-only > /tmp/qcs-transfer/capsule-verification.json
          cp -a experiments/publication_v1 /tmp/qcs-transfer/evidence-verification
          python -m hybrid_qcs.publication_evidence --output-dir /tmp/qcs-transfer/evidence-verification

      - name: Rebuild manuscript
        working-directory: /tmp/qcs-publication
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
          make -C publication
          test -s publication/main.pdf

      - name: Publish complete regenerated tree by fast-forward only
        working-directory: /tmp/qcs-publication
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          tree=$(git write-tree)
          git fetch origin publication-linear-certified-qcs-v1
          parent=$(git rev-parse origin/publication-linear-certified-qcs-v1)
          test "$(git rev-parse ${parent}:.github/workflows/publication-ci.yml)" = '2048b318a5f90752fbca9747ba0a7b78fae136e2'
          commit=$(printf '%s\n' 'Publish final linear certified QCS study with regenerated evidence' | git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$tree" -p "$parent")
          git push --porcelain origin "$commit":refs/heads/publication-linear-certified-qcs-v1
          remote=$(git ls-remote --heads origin refs/heads/publication-linear-certified-qcs-v1 | awk '{print $1}')
          test "$remote" = "$commit"
          printf '%s\n' "$commit" > /tmp/qcs-transfer/PUBLISHED_COMMIT.txt
          printf '%s\n' "$tree" > /tmp/qcs-transfer/PUBLISHED_TREE.txt
          echo "Published commit: $commit" >> "$GITHUB_STEP_SUMMARY"
          echo "Published tree: $tree" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-publication-transfer-validation
          path: /tmp/qcs-transfer
          retention-days: 30
