name: Validate and publish theorem-certified cleanup
on:
  push:
    branches: [cleanup-theorem-transfer-20260916]
    paths: [.github/workflows/publish-cleanup-theorem.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: theorem-cleanup-publication
  cancel-in-progress: false
jobs:
  validate-publish:
    if: github.repository == 'ssp2195/RL_for_Quantum_Circuits' && github.ref == 'refs/heads/cleanup-theorem-transfer-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconstruct exact locally tested source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/cleanup-transfer
          for sha in \
            2bc59b2c1b8f28fe7ea71bd6df9d335fa6791f02 \
            ccd3a69090b473a526cd35d0edeb4bd94d22a24d \
            96d0ced2b88d8d00c3a094e39496355d4f5b2e2d \
            34733920ec61897ab90c21360b418b2deea745df \
            df0282eb1183fd6380da519f2dcc9e5bb2ca2f64 \
            76da93d01ec2387b51ce1f49f76463a21c30918c \
            15671fc05eca2c8b00382770c03b1a88dcb4a129 \
            f577b0eb7429d424fb393cb0511cd9d6b122b0d4 \
            9846267c0cff32d27fdea9e12050dbb49fa0ee0d; do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" --jq .content | base64 --decode >> /tmp/cleanup-transfer/source.patch.xz
          done
          echo '42728df27afc14b36b1ccc64eb369a503ba90735f814ffa85930141e562405b2  /tmp/cleanup-transfer/source.patch.xz' | sha256sum -c -
          xz -dc /tmp/cleanup-transfer/source.patch.xz > /tmp/cleanup-transfer/source.patch
          echo '36d05bf829b7cb16d278bab4d9392a752f70483e8e06aa8e6bcace75d516378c  /tmp/cleanup-transfer/source.patch' | sha256sum -c -
          git worktree add --detach /tmp/cleanup-build 6c2f15ffc2e0ce524c6492f40f234a2862dba51a
          cd /tmp/cleanup-build
          git apply --check /tmp/cleanup-transfer/source.patch
          git apply /tmp/cleanup-transfer/source.patch
          git add -A
          test "$(git write-tree)" = 'a79d9087fcc4dfdf0f7f18de1b2ba3fb43ce900a'
          git diff --cached --check
          git diff --cached --exit-code -- hybrid_qcs/model.py hybrid_qcs/native_policy.py hybrid_qcs/native_search.py hybrid_qcs/native_domain.py hybrid_qcs/native_exact.py hybrid_qcs/native_audit.py hybrid_qcs/native_optimize.py hybrid_qcs/clifford_lift.py publication publication_native experiments
          git diff --cached --stat > /tmp/cleanup-transfer/source-diff-stat.txt
          echo a79d9087fcc4dfdf0f7f18de1b2ba3fb43ce900a > /tmp/cleanup-transfer/TESTED_SOURCE_TREE.txt
      - name: Full native and historical regression suite
        working-directory: /tmp/cleanup-build
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r publication_native/requirements-reproduction.txt
          python -m pip install -e '.[dev]'
          python -m compileall -q hybrid_qcs tests
          python -m pytest -q | tee /tmp/cleanup-transfer/pytest.log
          grep -Eq '1074 passed' /tmp/cleanup-transfer/pytest.log
          python -m pytest -q --collect-only tests/test_cleanup_theorem.py -m generated | tee /tmp/cleanup-transfer/post-training-test-count.log
          python -m pip freeze > /tmp/cleanup-transfer/runtime.txt
      - name: Fresh training and complete five-problem circuit-generation campaign
        working-directory: /tmp/cleanup-build
        shell: bash
        run: |
          set -euo pipefail
          python -u -m hybrid_qcs.cleanup.runner --output-dir experiments/cleanup_theorem_v1 | tee /tmp/cleanup-transfer/study.log
          python -m hybrid_qcs.cleanup.runner --stage verify --output-dir experiments/cleanup_theorem_v1 | tee /tmp/cleanup-transfer/independent-verification.log
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('experiments/cleanup_theorem_v1')
          s=json.loads((root/'summary.json').read_text())
          v=json.loads((root/'verification.json').read_text())
          assert s['candidate_count']==5 and s['total_runs']==285
          assert v['valid'] and v['rows']==285
          for row in s['by_method'].values():
              assert row['correct']==row['runs']
          for p in s['candidates']:
              for metric in ('peak_aux','t_count'):
                  assert p['theorem_vs_control_helpers'][metric]['conservative_improvement']>0
          # No test or publication gate requires a learned-policy advantage.
          PY
      - name: Publish source and regenerated evidence to a new branch only
        working-directory: /tmp/cleanup-build
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git diff --cached --exit-code -- hybrid_qcs/model.py hybrid_qcs/native_policy.py hybrid_qcs/native_search.py hybrid_qcs/native_domain.py hybrid_qcs/native_exact.py hybrid_qcs/native_audit.py hybrid_qcs/native_optimize.py hybrid_qcs/clifford_lift.py publication publication_native experiments/publication_v1 experiments/native_publication_v1
          tree=$(git write-tree)
          base=6c2f15ffc2e0ce524c6492f40f234a2862dba51a
          branch=theorem-cleanup-sarsa-linucb-v1
          remote=$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')
          test -z "$remote"
          commit=$(printf '%s\n' 'Integrate theorem-certified dynamic cleanup and post-training five-oracle study' 'Preserve native hybrid semantics; add exact all-outcome protocol verification, quantum/classical dependency witnesses, scoped workspace certificates, linear SARSA-LinUCB macro search, 4T clean-target AND lowering, matched deterministic and bank-free controls. All 1074 tests and 285 fresh post-training/control jobs validated; unfavorable learner and global-oracle comparisons retained.' | git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$tree" -p "$base")
          git push --porcelain origin "$commit:refs/heads/$branch"
          test "$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')" = "$commit"
          printf '%s\n' "$commit" > /tmp/cleanup-transfer/PUBLISHED_COMMIT.txt
          printf '%s\n' "$tree" > /tmp/cleanup-transfer/PUBLISHED_TREE.txt
          git update-ref "refs/heads/$branch" "$commit"
          git bundle create /tmp/cleanup-transfer/theorem-cleanup-sarsa-linucb-v1.bundle "refs/heads/$branch"
          echo "Published $branch at $commit" >> "$GITHUB_STEP_SUMMARY"
          cat experiments/cleanup_theorem_v1/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve completed or interrupted evidence
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/cleanup-transfer
          if [ -d /tmp/cleanup-build/experiments/cleanup_theorem_v1 ]; then cp -a /tmp/cleanup-build/experiments/cleanup_theorem_v1 /tmp/cleanup-transfer/evidence; fi
          if [ -f /tmp/cleanup-build/docs/theorem_cleanup_backend.md ]; then cp /tmp/cleanup-build/docs/theorem_cleanup_backend.md /tmp/cleanup-transfer/ARCHITECTURE.md; fi
          printf '%s\n' "$GITHUB_RUN_ID" > /tmp/cleanup-transfer/WORKFLOW_RUN_ID.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theorem-cleanup-published-validation
          path: /tmp/cleanup-transfer
          retention-days: 30
