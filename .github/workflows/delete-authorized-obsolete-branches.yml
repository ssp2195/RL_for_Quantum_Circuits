name: Delete authorized obsolete branches

on:
  push:
    branches: ["deferred-cost-aware-qcs-v1"]

permissions:
  contents: write

jobs:
  delete-authorized-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete only the explicitly authorized branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            compact-online-rl
            compact-parity-online-rl
            compact-parity-online-rl-30min
            exper-branch
            frontier-rl
            frontier-rl-exper
            ten-minute-protocol
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              git push origin --delete "${branch}"
              echo "deleted=${branch}"
            else
              echo "already_absent=${branch}"
            fi
          done
          echo "remaining remote branches:"
          git ls-remote --heads origin | sed 's#.*refs/heads/##' | sort
