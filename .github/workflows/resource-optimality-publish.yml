name: Publish verified resource-optimality implementation

on:
  push:
    branches: ["resource-ancilla-optimality-v1"]
    paths: [".github/workflows/resource-optimality-publish.yml"]

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'ssp2195/RL_for_Quantum_Circuits' && github.ref == 'refs/heads/resource-ancilla-optimality-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply hash-verified implementation, test and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ee18f947a40379b75a0f8940b0202fb5d5728389"
          mkdir -p /tmp/qcs-publication
          for sha in 39d09f77bf933e4024052f71a5bd9e96b975a915 6dce694244284f529d4c3dff916d69ab380230ce 76d63e9834259366182eed4366e0c279ec625741; do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" --jq .content | base64 --decode >> /tmp/qcs-publication/implementation.patch.xz
          done
          echo '27d4c3e1e119d94cccfd13f47e9036f766a05b49d90e10ce45b4cdbc5dc8e97a  /tmp/qcs-publication/implementation.patch.xz' | sha256sum -c -
          python - <<'PY'
          import lzma
          from pathlib import Path
          p = Path('/tmp/qcs-publication')
          (p / 'implementation.patch').write_bytes(lzma.decompress((p / 'implementation.patch.xz').read_bytes()))
          PY
          echo 'cdfdd91bf7109f074e5d9626eda5cbdca8c1226d69d4598079bfba960ee9bfb8  /tmp/qcs-publication/implementation.patch' | sha256sum -c -
          git apply --check /tmp/qcs-publication/implementation.patch
          git apply /tmp/qcs-publication/implementation.patch
          git rm .github/workflows/resource-optimality-publish.yml
          git add -A
          test "$(git write-tree)" = "5c8f5f97870af7461217b1f7fdf4deb34eca65b8"
          git diff --cached --check
          python -m pip install -e '.[dev]'
          python -m compileall -q hybrid_qcs tests
          python -m pytest -q | tee /tmp/qcs-publication/pytest.log
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Implement resource-conditioned search, clean-ancilla budgets and independently checked optimality certificates'
          git push origin HEAD:refs/heads/resource-ancilla-optimality-v1
          git rev-parse HEAD > /tmp/qcs-publication/COMMIT.txt
          git bundle create /tmp/qcs-publication/resource-ancilla-optimality-v1.bundle HEAD refs/heads/resource-ancilla-optimality-v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resource-optimality-publication
          path: /tmp/qcs-publication
          retention-days: 30
