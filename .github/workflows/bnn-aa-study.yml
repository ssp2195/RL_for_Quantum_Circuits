name: BNN amplitude-amplification phase-oracle study
on:
  push:
    branches: [bnn-amplitude-oracle-study-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-bnn-study:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r publication_native/requirements-reproduction.txt && python -m pip install -e '.[dev]'
      - name: Exact BNNS phase-oracle resource study
        run: python -m hybrid_qcs.cleanup.bnn_amplitude_study --output /tmp/bnn_aa_results.json
      - name: Independent tests on new proof machinery
        run: python -m pytest -q tests/test_generic_phase_cleanup.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bnn-aa-oracle-exact-results
          path: /tmp/bnn_aa_results.json
          retention-days: 30
