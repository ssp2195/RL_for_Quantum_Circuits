name: Generic Boolean phase and cleanup validation
on:
  push:
    branches: [stable-generic-phase-cleanup-20261102]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r publication_native/requirements-reproduction.txt && python -m pip install -e '.[dev]'
      - name: New exact generic and causal proof tests
        run: python -m pytest -q tests/test_generic_phase_cleanup.py
      - name: Full historical and general regression suite
        run: python -m pytest -q
      - name: Benchmark comparison
        run: python -m hybrid_qcs.cleanup.generic_runner --output /tmp/generic_phase_comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generic-phase-experimental-results
          path: /tmp/generic_phase_comparison.json
          retention-days: 30
