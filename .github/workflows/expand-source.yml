name: Expand packaged hybrid source

on:
  push:
    branches: ["hybrid-frontier-online-rl-30min"]

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand the validated source archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d .bootstrap ]]; then
            echo "Source tree is already expanded."
            exit 0
          fi
          cat .bootstrap/source.b64.part* | base64 --decode > /tmp/hybrid-source.zip
          python - <<'PY'
          from pathlib import Path
          import shutil
          import zipfile

          archive = Path('/tmp/hybrid-source.zip')
          unpack = Path('/tmp/hybrid-source-unpack')
          if unpack.exists():
              shutil.rmtree(unpack)
          with zipfile.ZipFile(archive) as bundle:
              bundle.extractall(unpack)
          source = unpack / 'hybrid_qcs_source'
          if not source.is_dir():
              raise SystemExit('validated source root missing from archive')
          shutil.copytree(source, Path('.'), dirs_exist_ok=True)
          PY
          rm -rf .bootstrap .github/workflows/expand-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand hybrid Clifford+T source tree"
          git push origin HEAD:hybrid-frontier-online-rl-30min
