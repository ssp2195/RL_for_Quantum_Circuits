name: Apply validated hierarchical QCS source

on:
  push:
    branches: ["hierarchical-linucb-canonicalizer-v1"]
    paths: [".bootstrap/READY"]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/change.patch.xz.b64.part* > /tmp/change.patch.xz.b64
          base64 --decode /tmp/change.patch.xz.b64 > /tmp/change.patch.xz
          test "$(stat -c%s /tmp/change.patch.xz)" = "38792"
          echo "62d510c72ae90e8d9eeebba910ceb45ab411590ee1476fdc3081b09395308010  /tmp/change.patch.xz" | sha256sum --check --strict
          xz --decompress --stdout /tmp/change.patch.xz > /tmp/change.patch
          git apply --check \
            --exclude=.github/workflows/delete-authorized-obsolete-branches.yml \
            --exclude=.github/workflows/ci.yml \
            /tmp/change.patch
          git apply \
            --exclude=.github/workflows/delete-authorized-obsolete-branches.yml \
            --exclude=.github/workflows/ci.yml \
            /tmp/change.patch

      - name: Remove one-time patch material
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap

      - name: Validate materialized source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m compileall -q hybrid_qcs tests
          python -m pytest -q
          git diff --check

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add hierarchical LinUCB search and strengthened canonicalization"
          git push origin HEAD:hierarchical-linucb-canonicalizer-v1
