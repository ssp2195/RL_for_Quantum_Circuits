name: Apply validated guided QFT-3 delta

on:
  push:
    branches: ["qft3-guided-ancilla-v1"]
    paths: [".qft3_delta/READY"]

permissions:
  contents: write

jobs:
  reconstruct-validate-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact source delta
        shell: bash
        run: |
          set -euo pipefail
          parts=(
            .qft3_delta/part000
            .qft3_delta/part001
            .qft3_delta/part002
            .qft3_delta/part003
            .qft3_delta/part004
            .qft3_delta/part005
          )
          for path in "${parts[@]}"; do
            test -s "$path"
          done
          cat "${parts[@]}" > /tmp/qft3_delta.tar.xz.b64
          test "$(stat -c%s /tmp/qft3_delta.tar.xz.b64)" = "20600"
          base64 -d /tmp/qft3_delta.tar.xz.b64 > /tmp/qft3_delta.tar.xz
          test "$(stat -c%s /tmp/qft3_delta.tar.xz)" = "15448"
          echo "e00b3ca9ec29712a0883019a57097799cc5643e644c8fd8023ee469ee90fd261  /tmp/qft3_delta.tar.xz" | sha256sum -c -
          xz -t /tmp/qft3_delta.tar.xz
          tar -xJf /tmp/qft3_delta.tar.xz -C .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install and run complete regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m compileall -q hybrid_qcs tests
          python -m pytest -q | tee /tmp/pytest.log
          grep -Eq "52 passed" /tmp/pytest.log
          git diff --check

      - name: Verify retained article package
        working-directory: Ancilla research article latex
        shell: bash
        run: sha256sum -c CHECKSUMS.sha256

      - name: Run bounded QFT-3 qualification
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MPLBACKEND: Agg
        run: |
          set -euo pipefail
          python -m hybrid_qcs.ancilla_runner \
            --output-dir outputs/qft3-guided-ci \
            --qft-allocations 64 \
            --qft-wall-limit 0.5
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("outputs/qft3-guided-ci/ancilla_summary.json").read_text())
          assert all(row["success"] for row in result["evaluations"]), result["evaluations"]
          guided = result["qft3"]["decomposition_guided_generation"]
          assert guided["certified"] is True, guided
          assert guided["native_gate_count"] == 35, guided
          assert guided["t_count"] == 15, guided
          assert guided["cnot_count"] == 13, guided
          assert guided["depth"] == 26, guided
          assert guided["ancilla_leakage"] < 1e-12, guided
          assert result["qft3"]["unrestricted_search"]["success"] is False
          PY

      - name: Publish validated source delta
        shell: bash
        run: |
          set -euo pipefail
          rm -rf outputs .pytest_cache hybrid_qcs.egg-info
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -name '*.pyc' -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add decomposition-guided exact QFT-3 generation"
          git push origin HEAD:qft3-guided-ancilla-v1
